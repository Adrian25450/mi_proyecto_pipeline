version: '3.8'

services:
  jenkins:
    container_name: jenkins-php
    image: jenkins/jenkins:2.462.1-lts-jdk21
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    user: root
    restart: unless-stopped

volumes:
  jenkins_data:
